x-logging: &logging
  logging:
    options:
      max-size: "8m"
      max-file: "10"

services:
  minecraft:
    <<: *logging
    image: itzg/docker-minecraft-server
    container_name: minecraft
    environment:
      EULA: "TRUE"
    volumes:
      - mc-data:/data
    restart: unless-stopped

  minedash:
    <<: *logging
    build: .
    restart: unless-stopped
    volumes:
      - mc-data:/mc-data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MC_CONTAINER_NAME=minecraft
      - AUTH_PASSWORD_HASH=       # bcrypt hash: htpasswd -bnBC 12 "" pw | tr -d ':\n'
      - JWT_SECRET=               # openssl rand -hex 32
      - PORT=8080
      - MC_UID=1000               # must match PUID of the minecraft container
      - MC_GID=1000               # must match PGID of the minecraft container
    networks:
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minedash.rule=Host(`mc.example.com`)"
      - "traefik.http.routers.minedash.entrypoints=websecure"

volumes:
  mc-data:

networks:
  gateway:
    name: gateway
    external: true
