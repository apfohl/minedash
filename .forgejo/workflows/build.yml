name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: apfohl-ceres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install dependencies
        run: go mod tidy
      - name: Build
        run: go build -v .
      - name: Run tests
        run: go test ./...
